name: Publish to Maven Central

on:
  release:
    types: [ created ]

# Don't let two release runs publish/stage concurrently and clobber each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Publish, Release Artifacts
    runs-on: ubuntu-latest
    # JReleaser updates the GitHub release and uploads assets via GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      # Optional: set the timezone so build/changelog timestamps are Europe/Oslo.
      - name: Setup timezone
        run: |
          sudo timedatectl set-timezone Europe/Oslo
          timedatectl

      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java 25 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Users often commit the Gradle wrapper without the execute bit.
      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Gate the release on a green build (compiles + runs tests, incl. SlimConfigurerTest).
      - name: Build and test
        run: ./gradlew build

      - name: Stage publication locally
        run: ./gradlew publish --info

      - name: Publish artifacts to Maven Central with JReleaser Gradle plugin
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_BRANCH: master
          JRELEASER_UPDATE: true
        run: ./gradlew jreleaserFullRelease --warn --stacktrace --warning-mode all

      # Persist logs
      - name: JReleaser release output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-release
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
            build/jreleaser
